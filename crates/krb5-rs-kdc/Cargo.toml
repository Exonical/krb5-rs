[package]
name = "krb5-rs-kdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Dmitry Prudnikov <mail@polaz.com>"]
description = "Deployable Kerberos KDC daemon and database administration tool built on krb5-rs"
repository = "https://github.com/structured-world/krb5-rs"
publish = false

[[bin]]
name = "krb5-rs-kdc"
path = "src/bin/krb5-rs-kdc.rs"

[[bin]]
name = "krb5-rs-kdb"
path = "src/bin/krb5-rs-kdb.rs"

[[bin]]
name = "krb5-rs-kprop"
path = "src/bin/krb5-rs-kprop.rs"

[[bin]]
name = "krb5-rs-kpropd"
path = "src/bin/krb5-rs-kpropd.rs"

[[bin]]
name = "krb5-rs-kadmind"
path = "src/bin/krb5-rs-kadmind.rs"
required-features = ["klmdb"]

[[bin]]
name = "krb5-rs-kproplog"
path = "src/bin/krb5-rs-kproplog.rs"

[features]
# MIT-compatible LMDB backend, selected with `db_library = klmdb`.
default = ["klmdb"]
klmdb = ["dep:krb5-rs-kdb-lmdb"]
# The Turso replica database module (db_library = krb5-rs-turso). Off by
# default: it pulls Turso, whose dependencies include C code (simsimd).
turso = ["dep:krb5-rs-kdb-turso"]
# The CockroachDB authoritative database module (db_library = krb5-rs-cockroach),
# used by `krb5-rs-kdb`. Off by default: it pulls rustls with aws-lc-rs (C code).
cockroach = ["dep:krb5-rs-kdb-cockroach", "turso"]

[dependencies]
krb5-rs-kdb-lmdb = { path = "../krb5-rs-kdb-lmdb", optional = true }
libc = "0.2"
krb5-rs-kdb-turso = { path = "../krb5-rs-kdb-turso", optional = true }
krb5-rs-kdb-cockroach = { path = "../krb5-rs-kdb-cockroach", optional = true }
clap = { version = "4", features = ["derive", "env"] }
krb5-rs = { path = "../..", features = ["kdc", "tokio", "pkinit"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
prometheus-client = "=0.25.1"
regex = "1"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53.2", features = ["test-util"] }
