x-mit-build: &mit-build
  context: tests/kdc
  dockerfile: Dockerfile

services:
  kdc:
    build: *mit-build
    image: krb5-rs-mit-test:1.22.2
    hostname: kdc.test.realm
    ports:
      - "10188:88/udp"
      - "10188:88/tcp"
      - "10189:10189/tcp"   # MIT GSS-API oracle (tests/kdc/gss_oracle.py)
      - "10190:8888/udp"    # KDC requiring PKINIT freshness (setup.sh)
      - "10190:8888/tcp"
    volumes:
      - ./tests/kdc/setup.sh:/setup.sh:ro
      - ./tests/kdc/gss_oracle.py:/gss_oracle.py:ro
      - ./tests/kdc/pki:/pki:ro
    command: ["/bin/bash", "/setup.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/88"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 60s

  kdc-other:
    build: *mit-build
    image: krb5-rs-mit-test:1.22.2
    hostname: kdc.other.realm
    ports:
      - "10288:88/udp"
      - "10288:88/tcp"
    volumes:
      - ./tests/kdc/setup-other.sh:/setup.sh:ro
    command: ["/bin/bash", "/setup.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/88"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 60s
