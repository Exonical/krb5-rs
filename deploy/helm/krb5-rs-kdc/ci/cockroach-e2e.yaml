apiVersion: v1
kind: Service
metadata:
  name: crdb
spec:
  clusterIP: None
  ports:
    - name: sql
      port: 26257
      targetPort: sql
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: crdb
---
apiVersion: v1
kind: Service
metadata:
  name: crdb-public
spec:
  ports:
    - name: sql
      port: 26257
      targetPort: sql
  selector:
    app.kubernetes.io/name: crdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crdb
spec:
  serviceName: crdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crdb
    spec:
      containers:
        - name: cockroach
          image: docker.io/cockroachdb/cockroach:v26.3.2@sha256:84f0c929fdd4284b40a0c4afb1f284573fb281abc0323f8329e4e5f1650a3e00
          imagePullPolicy: IfNotPresent
          command: ["/cockroach/cockroach"]
          args:
            - start-single-node
            - --certs-dir=/cockroach/certs
            - --listen-addr=0.0.0.0:26257
            - --advertise-addr=crdb-0.crdb:26257
            - --http-addr=0.0.0.0:8080
            - --cache=256MiB
            - --max-sql-memory=256MiB
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command:
                - /cockroach/cockroach
                - sql
                - --certs-dir=/cockroach/certs
                - --host=localhost:26257
                - -e
                - SELECT 1
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: certs
              mountPath: /cockroach/certs
              readOnly: true
            - name: data
              mountPath: /cockroach/cockroach-data
      volumes:
        - name: certs
          secret:
            secretName: cockroach-node-certs
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          krb5-rs-e2e: cockroach
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
