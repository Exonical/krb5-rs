apiVersion: v1
kind: Service
metadata:
  name: {{ include "krb5-rs-kdc.primaryService" . }}
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: ClusterIP
  ports:
    - name: kdc-tcp
      port: {{ .Values.kdc.containerPort }}
      targetPort: kdc-tcp
      protocol: TCP
    - name: kprop
      port: {{ .Values.propagation.port }}
      targetPort: kprop
      protocol: TCP
  selector:
    {{- include "krb5-rs-kdc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
