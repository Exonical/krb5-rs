{{- if and (eq .Values.database.mode "cockroach") .Values.cockroach.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krb5-rs-kdc.fullname" . }}-bootstrap
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  migrate-kdc.conf: |
    {{- include "krb5-rs-kdc.cockroachClientConf" (dict "ctx" . "url" .Values.cockroach.bootstrap.migrateUrl "certDir" "/crdb-migrate") | nindent 4 }}
  admin-kdc.conf: |
    {{- include "krb5-rs-kdc.cockroachClientConf" (dict "ctx" . "url" .Values.cockroach.admin.url "certDir" "/crdb-admin") | nindent 4 }}
  krb5.conf: |
    {{- include "krb5-rs-kdc.krb5Conf" . | nindent 4 }}
{{- end }}
