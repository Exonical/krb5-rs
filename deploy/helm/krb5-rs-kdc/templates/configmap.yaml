{{- if eq .Values.database.mode "file" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krb5-rs-kdc.fullname" . }}
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
data:
  primary-kdc.conf: |
    {{- include "krb5-rs-kdc.kdcConf" (dict "ctx" . "role" "primary") | nindent 4 }}
  replica-kdc.conf: |
    {{- include "krb5-rs-kdc.kdcConf" (dict "ctx" . "role" "replica") | nindent 4 }}
  keytab-kdc.conf: |
    [realms]
     {{ .Values.realm }} = {
      database_name = /keytab/principal
      key_stash_file = /keytab/stash
      supported_enctypes = {{ .Values.kdc.supportedEnctypes }}
     }
  {{- if .Values.propagation.iprop.enabled }}
  replica-stash.conf: |
    [realms]
     {{ .Values.realm }} = {
      database_name = /keytab/principal
      key_stash_file = /var/lib/krb5-rs/stash
      supported_enctypes = {{ .Values.kdc.supportedEnctypes }}
     }
  {{- end }}
  kpropd.acl: |
    host/{{ include "krb5-rs-kdc.primaryHost" . }}@{{ .Values.realm }}
  {{- if or .Values.propagation.iprop.enabled .Values.kadmin.enabled }}
  kadm5.acl: |
    {{- if .Values.propagation.iprop.enabled }}
    {{- range $i := until (int .Values.replicas.replicaCount) }}
    kiprop/{{ include "krb5-rs-kdc.replicaHost" (dict "ctx" $ "i" $i) }}@{{ $.Values.realm }} p
    {{- end }}
    {{- end }}
    {{- if .Values.kadmin.enabled }}
    {{- range .Values.kadmin.acl }}
    {{ . }}
    {{- end }}
    {{- end }}
  {{- end }}
  kprop-krb5.conf: |
    [libdefaults]
     default_realm = {{ .Values.realm }}
     dns_lookup_kdc = false
     dns_lookup_realm = false
     udp_preference_limit = 1
    [realms]
     {{ .Values.realm }} = {
      kdc = 127.0.0.1:{{ .Values.kdc.containerPort }}
     }
  {{- if .Values.propagation.iprop.enabled }}
  iprop-krb5.conf: |
    [libdefaults]
     default_realm = {{ .Values.realm }}
     dns_lookup_kdc = false
     dns_lookup_realm = false
     udp_preference_limit = 1
    [realms]
     {{ .Values.realm }} = {
      kdc = {{ include "krb5-rs-kdc.primaryHost" . }}:{{ .Values.kdc.containerPort }}
     }
  {{- end }}
  krb5.conf: |
    [libdefaults]
     default_realm = {{ required "realm is required" .Values.realm }}
     dns_lookup_kdc = false
     dns_lookup_realm = false
    {{- if .Values.kdc.domainRealm }}

    [domain_realm]
    {{- range $domain, $realm := .Values.kdc.domainRealm }}
     {{ $domain }} = {{ $realm }}
    {{- end }}
    {{- end }}
    {{- with .Values.kdc.extraKrb5Conf }}

    {{- . | nindent 4 }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krb5-rs-kdc.fullname" . }}
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
data:
  kdc.conf: |
    {{- include "krb5-rs-kdc.cockroachKdcConf" . | nindent 4 }}
  krb5.conf: |
    {{- include "krb5-rs-kdc.krb5Conf" . | nindent 4 }}
{{- if .Values.kadmin.enabled }}
  kadmind-kdc.conf: |
    {{- include "krb5-rs-kdc.cockroachKadmindConf" . | nindent 4 }}
  kadm5.acl: |
    {{- range .Values.kadmin.acl }}
    {{ . }}
    {{- end }}
{{- end }}
{{- if .Values.cockroach.admin.url }}
  admin-kdc.conf: |
    {{- include "krb5-rs-kdc.cockroachClientConf" (dict "ctx" . "url" .Values.cockroach.admin.url "certDir" "/crdb-admin") | nindent 4 }}
{{- end }}
{{- end }}
