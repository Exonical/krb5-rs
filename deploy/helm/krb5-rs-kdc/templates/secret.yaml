{{- if not .Values.secrets.existingSecret }}
{{- $name := include "krb5-rs-kdc.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  master-password: {{ index $existing.data "master-password" }}
  kprop-password: {{ index $existing.data "kprop-password" }}
  {{- else }}
  master-password: {{ randAlphaNum 32 | b64enc }}
  kprop-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
