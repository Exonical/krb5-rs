{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "krb5-rs-kdc.fullname" . }}
  labels:
    {{- include "krb5-rs-kdc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "krb5-rs-kdc.kdcSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Kerberos requests from anywhere.
    - ports:
        - port: {{ .Values.kdc.containerPort }}
          protocol: UDP
        - port: {{ .Values.kdc.containerPort }}
          protocol: TCP
{{- if .Values.metrics.networkPolicy.from }}
    # Kubelet probes still work: NetworkPolicy cannot block access from a pod's resident node.
    - from:
        {{- toYaml .Values.metrics.networkPolicy.from | nindent 8 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
{{- end }}
{{- if eq .Values.database.mode "file" }}
    # Database propagation only from the replicas.
    - from:
        - podSelector:
            matchLabels:
              {{- include "krb5-rs-kdc.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: replica
      ports:
        - port: {{ .Values.propagation.port }}
          protocol: TCP
{{- end }}
{{- end }}
