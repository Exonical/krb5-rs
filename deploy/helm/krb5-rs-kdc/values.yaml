# krb5-rs KDC: one writable primary (StatefulSet + PVC) and N stateless
# replicas (Deployment, emptyDir) that pull the database from the primary.
# One Service ("kdc") load-balances Kerberos requests over all of them.

# Kerberos realm served (required, e.g. EXAMPLE.COM). No default.
realm: ""

database:
  # file: one primary + replicas that pull the file database (default).
  # cockroach: every KDC pod replicates CockroachDB into its own Turso replica.
  mode: file

cockroach:
  url: ""              # KDC connection as kdc_replica, sslmode=verify-full (required in cockroach mode)
  tlsSecret: ""        # Secret with ca.crt, tls.crt, tls.key for kdc_replica (required)
  region: ""           # this release's region, e.g. california (required)
  poolSize: 8
  poolIdleTimeout: 0s  # 0s keeps pooled connections indefinitely; set to retire idle connections sooner
  connectTimeout: 5s
  statementTimeout: 10s
  transactionTimeout: 30s   # must be identical everywhere: migrate stores it, KDCs refuse to start on mismatch
  replicationRead: follower # follower | present
  consistencyMode: bounded  # bounded | strict
  maxStaleness: 30s
  authoritativeTimeout: 500ms
  replication:
    pollInterval: 1s
    batchLimit: 1000
    retryMin: 100ms
    retryMax: 30s
    rebuild: auto           # auto | manual
    heartbeatInterval: 5s
  turso:
    poolSize: 8
  admin:
    url: ""                 # as kdc_admin: bootstrap Job, prune CronJob and the admin command in NOTES
    tlsSecret: ""
  bootstrap:
    enabled: false          # enable in exactly one release per database
    # A failed bootstrap Job stays for inspection until the next hook run.
    migrateUrl: ""          # a user with the admin role (e.g. root)
    migrateTlsSecret: ""
    multiRegion:
      enabled: false
      primaryRegion: ""
      regions: []
    backoffLimit: 6
    activeDeadlineSeconds: 900
  prune:
    enabled: false          # enable in exactly one release per database
    schedule: "17 3 * * *"
    olderThan: 7d

kdcs:
  replicaCount: 3
  persistence:
    enabled: true           # false = emptyDir (each restart takes a fresh snapshot)
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  pdb:
    enabled: true
    maxUnavailable: 1
  startupFailureThreshold: 180   # x 5 s: time allowed for the first snapshot
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

metrics:
  port: 9100        # /metrics, /healthz, /readyz; always on in cockroach mode
  enabled: false    # also serve them in file mode
  networkPolicy:
    # Peers allowed to scrape metrics. Kubelet probes still work because
    # NetworkPolicy cannot block access from a pod's resident node.
    from: []

image:
  repository: ghcr.io/exonical/krb5-rs-kdc
  # Defaults to the chart appVersion.
  tag: ""
  # Optional "sha256:..." digest; when set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

kdc:
  # Unprivileged port the daemon listens on (UDP and TCP); the Service
  # maps service.port (88) to it.
  containerPort: 8888
  maxLife: 24h
  maxRenewableLife: 7d
  supportedEnctypes: "aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal"
  # krb5.conf [domain_realm]: host/domain -> realm, e.g. { ".example.com": "EXAMPLE.COM" }
  domainRealm: {}
  # Raw text appended to the end of kdc.conf / krb5.conf.
  extraKdcConf: ""
  extraKrb5Conf: ""

primary:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

replicas:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  type: LoadBalancer
  # Kerberos port clients use (UDP and TCP).
  port: 88
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""

propagation:
  # The primary's krb5-rs-kprop sidecar dumps the database and pushes it to
  # every replica's krb5-rs-kpropd (MIT kprop protocol) every `interval`
  # seconds. `port` is the kpropd port (MIT's 754 needs root).
  port: 7540
  interval: 60
  # MIT incremental propagation, off by default. When enabled the primary
  # runs krb5-rs-kadmind -proponly instead of the kprop sidecar, and each
  # replica's kpropd polls it every `pollInterval` as kiprop/<pod FQDN>,
  # falling back to a full kprop push when it falls behind the update log.
  # File (klmdb) mode only; CockroachDB mode rejects it.
  iprop:
    enabled: false
    port: 7550
    pollInterval: 2m
    ulogSize: 1000
    resyncTimeout: 5m

# Remote administration (file mode only), off by default. The primary runs
# krb5-rs-kadmind, which serves MIT kadmin (kadm5 RPC over TCP) and kpasswd
# (UDP and TCP) through the "<fullname>-kadmin" Service; with iprop enabled
# the same kadmind also serves iprop. Grant permissions with `acl`, lines of
# MIT kadm5.acl, e.g. "admin/admin@EXAMPLE.COM *", and create those principals
# with krb5-rs-kdb addprinc on the primary. The kadmin/admin and
# kadmin/changepw service principals are created with the database.
kadmin:
  enabled: false
  # Container ports (MIT's 749 and 464 need root).
  containerPort: 7490
  kpasswdContainerPort: 4640
  acl: []
  service:
    type: ClusterIP
    port: 749
    kpasswdPort: 464
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
  networkPolicy:
    # NetworkPolicy peers allowed to reach kadmin and kpasswd; empty allows all.
    from: []

# Cluster DNS domain, part of the pods' host/<FQDN> kprop principals.
clusterDomain: cluster.local

secrets:
  # Name of an existing Secret with keys "master-password" and
  # "kprop-password" (password of the host/ kprop principals). When empty a Secret with random values is created on
  # install and kept across upgrades and uninstall.
  existingSecret: ""

networkPolicy:
  enabled: false

topology:
  # Prefer different nodes for all KDC pods (primary and replicas).
  antiAffinity:
    enabled: true
  # Spread KDC pods across zones (best effort).
  spread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone

priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
