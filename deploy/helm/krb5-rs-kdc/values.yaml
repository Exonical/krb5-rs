# krb5-rs KDC: one writable primary (StatefulSet + PVC) and N stateless
# replicas (Deployment, emptyDir) that pull the database from the primary.
# One Service ("kdc") load-balances Kerberos requests over all of them.

# Kerberos realm served (required, e.g. EXAMPLE.COM). No default.
realm: ""

image:
  repository: ghcr.io/exonical/krb5-rs-kdc
  # Defaults to the chart appVersion.
  tag: ""
  # Optional "sha256:..." digest; when set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

kdc:
  # Unprivileged port the daemon listens on (UDP and TCP); the Service
  # maps service.port (88) to it.
  containerPort: 8888
  maxLife: 24h
  maxRenewableLife: 7d
  supportedEnctypes: "aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal"
  # krb5.conf [domain_realm]: host/domain -> realm, e.g. { ".example.com": "EXAMPLE.COM" }
  domainRealm: {}
  # Raw text appended to the end of kdc.conf / krb5.conf.
  extraKdcConf: ""
  extraKrb5Conf: ""

primary:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

replicas:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  type: LoadBalancer
  # Kerberos port clients use (UDP and TCP).
  port: 88
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""

propagation:
  # Primary -> replica database propagation (protocol KRB5RS-PROP-1).
  port: 7540
  servicePrincipal: kprop/primary
  clientPrincipal: kprop/replica
  pollInterval: 60s

secrets:
  # Name of an existing Secret with keys "master-password" and
  # "kprop-password". When empty a Secret with random values is created on
  # install and kept across upgrades and uninstall.
  existingSecret: ""

networkPolicy:
  enabled: false

topology:
  # Prefer different nodes for all KDC pods (primary and replicas).
  antiAffinity:
    enabled: true
  # Spread KDC pods across zones (best effort).
  spread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone

priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
